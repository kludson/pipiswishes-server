services:
  db:
    image: postgres:17
    container_name: pipiswishes-db

    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:?Set DB_PASSWORD or POSTGRES_PASSWORD in .env}}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  app:
    build: .
    container_name: pipiswishes-app

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://db:5432/postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:?Set DB_PASSWORD or POSTGRES_PASSWORD in .env}}

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data:
